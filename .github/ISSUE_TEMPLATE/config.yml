# Blank issues are off. The form is not bureaucracy — every field in it is something the
# maintainers would otherwise have to ask for in a round trip, and a report that skips them
# usually dies waiting for a reply. Human attention is the scarcest resource this project
# spends (CLAUDE.md §1.6); the form is how a report survives without needing any.
blank_issues_enabled: false

contact_links:
  - name: Security vulnerability
    url: https://github.com/shbernal/ts-xlsx/security/advisories/new
    about: >-
      Anything exploitable by a hostile workbook — unbounded allocation, a zip bomb, a path
      escaping extraction. Report it privately here, never in a public issue.

  - name: Coming from ExcelJS, and something no longer works
    url: https://github.com/shbernal/ts-xlsx/blob/master/docs/migrating-from-exceljs.md
    about: >-
      This is a hard fork with no compatibility guarantee, so an API that moved is usually a
      documented break rather than a bug. The migration guide names the new shape.

  - name: About to open a pull request
    url: https://github.com/shbernal/ts-xlsx/blob/master/docs/agent-correctness-playbook.md
    about: >-
      The situation → check → command dispatch table: what you are changing, and the check
      that proves it correct before you send it.

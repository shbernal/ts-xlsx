name: Agent-assisted report
description: A defect found while using ts-xlsx in another project — the form the library's own error messages link to.
title: '<area>: <one specific symptom>'
labels: ['agent-reported']
body:
  - type: markdown
    attributes:
      value: |
        This form is aimed at an AI agent filing on a user's behalf, and at anyone who
        arrived from a `Please report it:` line in a ts-xlsx error message. It asks for
        exactly what turns a report into a permanent regression test.

        **Do not attach a workbook containing real data.** Spreadsheets carry salaries,
        customer lists, and unreleased numbers, and this tracker is public. Reduce the
        failure to a script that builds its own input — the "Minimal reproduction" field
        below is the one that decides whether this gets fixed.

        The `ts-xlsx-upstream` skill walks through all of this:
        `npx skills add shbernal/ts-xlsx --skill ts-xlsx-upstream`

  - type: input
    id: version
    attributes:
      label: ts-xlsx version
      description: 'Exact installed version: `node -p "require(''@shbernal/ts-xlsx/package.json'').version"`'
      placeholder: 1.1.0
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: '`node -v`'
      placeholder: v24.0.0
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of failure is this?
      options:
        - Threw an InternalError (the library declares this one ours)
        - Cannot read a file that opens cleanly in Excel
        - Wrote a file Excel repairs, rejects, or renders wrong
        - Round-trip loses or changes data
        - Types are wrong (block correct code, or admit code that throws)
        - Documented behaviour does not match observed behaviour
        - Missing feature / feature request
        - Something else
    validations:
      required: true

  - type: input
    id: error-code
    attributes:
      label: Error code and class
      description: '`error.code` and `error.name`, if anything was thrown.'
      placeholder: internal / InternalError
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What should have happened
      description: >-
        And why you believe that — a clause of ECMA-376, what Excel itself does with the
        same input, or what the docs promise. "Why" is what makes this actionable rather
        than a matter of opinion.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >-
        A self-contained script that constructs its own input and fails. Cut it down until
        removing anything more makes the failure disappear.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Verbatim message and stack trace. Do not paraphrase.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: attachment
    attributes:
      label: Is a file attached, and where did it come from?
      options:
        - No file — the reproduction builds its own input
        - Synthesized file, contains no real data
        - Redacted file, shared with the owner's explicit permission
      description: >-
        There is deliberately no option for a file with real data in it. If the failure only
        reproduces against one, say so in "What happened" and describe the structural feature
        you suspect (a shared formula, a pivot cache, an inline string, a namespace prefix).
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues for this error message and found no match.
          required: true
        - label: No confidential data appears in this report or its attachments.
          required: true

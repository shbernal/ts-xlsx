name: Environment

# The gate that guards publishing, declared here and checked against reality.
#
# `publish.yml` names the `npm-publish` deployment environment, which is where the tags-only
# restriction lives. Those settings are repo *settings* — invisible in a diff, unreviewable,
# and silently editable by anyone with admin. This file is the declaration of what they must
# be; this job fails when the live environment disagrees with it.
#
# It used to *provision* them, which needed `ENV_ADMIN_TOKEN` — a PAT with Administration
# rights, because `administration` is not among the permissions a workflow may request for
# GITHUB_TOKEN and the environments API is an administration endpoint. That secret was never
# created after the reviewer removal of 2026-08-05 was applied by hand, so the file spent its
# life unable to run: a control that cannot execute is documentation wearing a workflow's
# clothes. *Reading* an environment, unlike writing one, needs no more than read access to the
# repository — so the check runs on the built-in token and no long-lived credential exists in
# this repository at all, which is the property publish.yml already had. See ADR-0026.
#
# The trade is that drift is now detected rather than corrected: a failure here prints what
# differs and you set it by hand under Settings → Environments. Detection is the half that
# was load-bearing — the failure mode this guards against is a settings edit nobody sees.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to check
        type: string
        default: npm-publish
  # A settings-page edit lands no commit, so nothing but the clock would ever notice it.
  schedule:
    - cron: '17 6 * * 1'
  # And editing the declaration re-checks it against what the repository is actually set to,
  # so the two cannot be changed apart without a red run.
  push:
    branches: [master]
    paths: ['.github/workflows/environment.yml']

# Reading an environment needs read access to the repository and nothing else.
permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ inputs.environment || 'npm-publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare the live environment against this declaration
        env:
          GH_TOKEN: ${{ github.token }}
          ENV_NAME: ${{ inputs.environment || 'npm-publish' }}
        run: |
          set -euo pipefail

          # What the gate must be.
          #
          # No required reviewer, deliberately: on a single-maintainer project the only login
          # that could approve a release was the one that had just cut it. What the click
          # genuinely stopped was an *accidental* publish, and the tag rule now carries that
          # alone — ADR-0026 records what that trades away.
          #
          # protected_branches false with custom_branch_policies true is what lets a *tag* rule
          # exist at all; the two are one setting reported as two fields, so both are asserted.
          cat > "${RUNNER_TEMP}/declared.json" <<'JSON'
          {
            "wait_timer_minutes": 0,
            "reviewers": [],
            "protected_branches": false,
            "custom_branch_policies": true,
            "deploys_from": ["tag v*"]
          }
          JSON

          if ! environment=$(gh api "/repos/${GITHUB_REPOSITORY}/environments/${ENV_NAME}" 2>&1); then
            echo "::error::cannot read environment ${ENV_NAME}"
            echo "${environment}"
            echo "If it is missing, create it under Settings -> Environments. publish.yml names"
            echo "it and npm's trusted publisher pins the name, so a publish cannot run without"
            echo "it — and an absent environment fails open, admitting any ref."
            exit 1
          fi
          # The policies endpoint exists only while custom policies are switched on: with them
          # off it answers 404, not an empty list. Asking anyway turns the drift that matters
          # most — the tag rule removed — into a bare "gh: Not Found" with nothing to read, so
          # the switch is consulted first and "off" is spelled as the empty list it means.
          if [ "$(jq -r '.deployment_branch_policy.custom_branch_policies // false' <<<"${environment}")" = true ]; then
            policies=$(gh api "/repos/${GITHUB_REPOSITORY}/environments/${ENV_NAME}/deployment-branch-policies")
          else
            policies='{"branch_policies": []}'
          fi

          # Every field is read through a list-and-default rather than a bare stream: a rule
          # that is absent must be reported as absent, not silently drop the line that would
          # have carried it. That is the same reason `deployment_branch_policy` is defaulted —
          # GitHub reports "no policy at all" as null, and null admits everything.
          configured=$(jq -n --argjson env "${environment}" --argjson policies "${policies}" '{
            wait_timer_minutes: ([$env.protection_rules[] | select(.type == "wait_timer") | .wait_timer] | first // 0),
            reviewers: ([$env.protection_rules[] | select(.type == "required_reviewers") | .reviewers[].reviewer.login] | sort),
            protected_branches: ($env.deployment_branch_policy.protected_branches // false),
            custom_branch_policies: ($env.deployment_branch_policy.custom_branch_policies // false),
            deploys_from: ([$policies.branch_policies[] | "\(.type) \(.name)"] | sort)
          }')

          if diff -u --label declared --label configured \
              <(jq -S . "${RUNNER_TEMP}/declared.json") <(jq -S . <<<"${configured}"); then
            echo "environment ${ENV_NAME} is what this file says it is:"
            jq -S . <<<"${configured}"
          else
            echo "::error::environment ${ENV_NAME} has drifted from .github/workflows/environment.yml"
            echo "Above, '-' is what this file declares and '+' is how the repository is set."
            echo "Reconcile under Settings -> Environments -> ${ENV_NAME}, or edit this file if"
            echo "the new configuration is the intended one — but say why in ADR-0026."
            exit 1
          fi

# Lefthook's postinstall is denied, not merely unlisted. All it does is
# `lefthook install -f`, and that `-f` is the one thing scripts/install-hooks.ts
# is written to refuse: with core.hooksPath pointing at a machine-wide hooks
# directory, forcing writes lefthook's wrappers in there and renames whatever
# stood in their place to `.old`, disarming every other repo on the machine. The
# prepare script decides that question properly, per checkout. The binary itself
# needs no build step, it arrives prebuilt in lefthook-<os>-<arch>, so denying
# this costs only the hook install we did not want.
allowBuilds:
  # Vite's transform pipeline, pulled in under vitepress. Its postinstall does one thing:
  # resolve the prebuilt platform binary from the optional @esbuild/<os>-<arch> package and
  # put it where the shim expects it. Deny it and the site build fails at the first import
  # with a binary-not-found error, so there is no version of this that is off.
  esbuild: true
  lefthook: false
# `ooxml-validate` is the schema oracle this repo's OOXML gate is built on and `charcheck`
# is the banned-character gate; both are published from repos of the same author. The
# release-age delay exists to let a compromised or broken publish be caught by someone else
# first, which does not apply to a publish we performed ourselves, so holding either for a
# day would only delay the gate, not vet it. Unversioned deliberately: a version-pinned
# exclusion has to be edited in the same breath as every bump, and until it is, the
# *previous* version is the one the policy rejects, because the lockfile is checked before
# the new resolution lands. `pnpm add` writes the pinned form; unpin it by hand. Bumps that
# are not hand-made arrive through Renovate, whose own 3-day cooldown already clears pnpm's.
#
# Note the default is not visible through `pnpm config get minimumReleaseAge`, which
# reports `undefined` while pnpm still enforces 1440 minutes.
minimumReleaseAgeExclude:
  - ooxml-validate
  - charcheck

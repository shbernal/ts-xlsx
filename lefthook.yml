# Git hooks, managed by lefthook. Installed automatically on `pnpm install` by
# the `prepare` script — except where `core.hooksPath` points outside this repo,
# which `scripts/install-hooks.ts` reports and steps around rather than failing
# the install. These mirror the CI gates so a failure surfaces locally instead of
# on the runner — the same "green checks are the moat" contract from CLAUDE.md,
# enforced one step earlier.
#
# Bypass a hook when you genuinely must: `git commit --no-verify` /
# `git push --no-verify`, or `LEFTHOOK=0 git …` to disable all hooks.
#
# Both jobs run their tool as `node <file>`, never through `pnpm exec` or a
# `node_modules/.bin` shim. A hook pays that wrapper on every single invocation,
# and it is not small: `pnpm exec` re-verifies the whole dependency tree before
# the tool sees an argument. Measured on this machine with `biome --version`,
# which does no work at all — ~0.94 s through `pnpm exec`, ~0.51 s through the
# `.bin` shim, ~0.21 s direct. That is overhead, not lint.

# The commit-msg gates live in shbernal/lefthook-rules, not here, because they
# are not about this project: every repo wants them and every repo would
# otherwise hold its own drifting copy. Lefthook fetches the remote on
# `install` (not on `dump`), caches it under `.git/info/lefthook-remotes/`, and
# merges its jobs into the same hook. `prepare` already runs install.
#
# `ref:` is a tag, never a branch — a branch would let any push to the rules
# repo change what this repo runs. `refetch_frequency` is what lets a fix reach
# here at all: without it the cached copy is permanent.
#
# A sync failure is not fatal. Lefthook prints "Couldn't sync … Will continue
# anyway" and still exits 0, so an offline install does not take `prepare` down
# — but it also leaves the rules unenforced until the next successful fetch.
# Verify after a fresh clone: `git commit` should show the remote jobs run.
#
# `no-shell-quoting-leak` is not theoretical here. Two commits in this history
# open with a bare `@` line: a PowerShell `@'…'@` here-string, written by an
# agent on Windows and run through a POSIX shell, which passes the delimiter
# through as text. Write a multi-line message to a file and use
# `git commit -F <file>`.
remotes:
  - git_url: https://github.com/shbernal/lefthook-rules
    ref: v1
    configs:
      - rules/no-ai-attribution.yml
      - rules/no-shell-quoting-leak.yml
    refetch_frequency: 24h

# Fast, staged-scoped: format + lint only what you're committing, and re-stage
# any autofixes so the commit is always Biome-clean.
#
# `bin/biome` is the `bin` entry from Biome's own package.json — the file the
# `.bin` shim is generated from and would have run, so this is the published
# contract rather than a reach into the package. `scripts/install-hooks.ts`
# resolves lefthook the same way, for the same reason.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,js,mjs,cjs,json,jsonc}"
      run: node node_modules/@biomejs/biome/bin/biome check --write --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

# Full source-correctness gate, mirroring .github/workflows/corpus.yml. Runs on
# the whole tree (not just staged files) because a push may carry commits made
# with --no-verify. This is exactly what CI will check, run before the round-trip.
#
# One job, because scripts/verify.ts already defines the gate set and schedules it.
# Re-listing the gates here would be a second definition of "everything" to keep in
# sync — and the one that silently drifts, since a hook is the copy nobody reads.
# CI runs the same single command, for the same reason.
pre-push:
  jobs:
    - name: verify
      run: node scripts/verify.ts --full

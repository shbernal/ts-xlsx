<svg xmlns="http://www.w3.org/2000/svg" width="900" height="452" viewBox="0 0 900 452" role="img" aria-labelledby="t d">
<title id="t">How @shbernal/ts-xlsx is shaped</title>
<desc id="d">.xlsx, .xlsb and CSV bytes are read by readXlsx, readXlsb and readCsv into a Workbook, Worksheet, Row/Column, Cell model, which writeXlsx, writeXlsxAsync and writeCsv turn back into bytes. A streaming lane reads .xlsx row by row with readSheetRows or readWorkbookStream and writes with WorkbookStreamWriter from the /node entry, the only entry that uses node:fs and node:stream.</desc>

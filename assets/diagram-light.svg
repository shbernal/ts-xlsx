<text x="16" y="440" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">Every entry except <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8a5300">/node</tspan> is browser-safe.  Also: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#146c43">/vba</tspan>  <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#146c43">/customui</tspan>  <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#146c43">/errors</tspan>.  The root import carries all of it except <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8a5300">/node</tspan>.</text>
